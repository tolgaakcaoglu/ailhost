server {
	listen 80;
	listen [::]:80;

	server_name hazirkurumsalsite.com.tr www.hazirkurumsalsite.com.tr;

	root /var/www/hazirkurumsalsite.com.tr/public_html;
	index index.html index.htm;

	access_log /var/log/nginx/hazirkurumsalsite.com.tr.access.log;
	error_log /var/log/nginx/hazirkurumsalsite.com.tr.error.log;

	location /test_site {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
